model_list:
  - model_name: __MODEL_ID__
    litellm_params:
      model: __MODEL_ID__
#      api_key: os.environ/OPENAI_API_KEY
      # force guardrails to apply automatically
      force_user_to_declare_guardrails: false
      use_litellm_proxy: true

guardrails:
  - guardrail_name: "inject-tools"
    litellm_params:
      guardrail: inject_tools.InjectToolsGuardrail
      mode: "pre_call"
      default_on: true