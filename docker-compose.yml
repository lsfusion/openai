version: "3.9"
services:
  proxy:
    build: .
    image: ghcr.io/lsfusion/openai:latest
    ports:
      - "4000:4000"
    environment:
      OPENAI_API_KEY: "sk-REPLACE_ME"

      # Single model param (base or fine-tuned).
      # If unset, defaults to gpt-4o-mini at runtime.
      # MODEL_ID: "ft:gpt-4o-mini-2025:org_123:my-model:xyz"

      # Optional file search: comma-separated
      # VECTOR_STORE_IDS: "vs_XXXX,vs_YYYY"

      # Optional MCP: full server URL as single variable
      # MCP_URL: "https://my-mcp.example.com/api"
      # MCP_HEADERS_JSON: '{"Authorization":"Bearer xyz"}'

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
